<html lang="en"><head><meta charset="utf-8">

<title>__TITLE__ · system</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--hair);background:var(--surface)}

.page{padding:22px 26px 60px;max-width:1180px}.page h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}.page .lead{color:var(--muted);margin:0 0 18px;max-width:760px}

.dtool .sp{flex:0}.btn{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--faint)}.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;color:var(--ink);white-space:nowrap}

.canvas:active{cursor:grabbing}.canvas svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}

.cont>rect{fill:var(--surface);fill-opacity:.55;stroke:var(--faint);stroke-dasharray:4 3;stroke-width:1.2}

.dcard .t{font-size:15px;font-weight:600}.dcard .meta{color:var(--muted);font-size:12.5px;margin-bottom:6px}

.icd{width:100%;border-collapse:collapse;font-size:13px}.icd th,.icd td{text-align:left;padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}

.ibar{display:flex;gap:8px;align-items:center}
.icard{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.icard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.icard .num{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12.5px}
.icard .t{font-weight:600;font-size:14.5px}.icard .meta{color:var(--faint);font-size:12px;margin-left:auto}

.lab{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--muted)}
.lab.bug{border-color:var(--crit);color:var(--crit-ink)}.lab.idea{border-color:var(--accent);color:var(--accent)}
.state{font-size:11.5px;font-weight:700}.state.open{color:var(--good-ink)}.state.closed{color:var(--faint)}
.docs{display:grid;grid-template-columns:240px 1fr;gap:24px}.dlist{position:sticky;top:0;align-self:start}
.dlist .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px}

</style></head><body>
<header><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="counters" id="counters"></div></header>
<div class="shell"><nav id="nav"></nav><main id="main"></main><aside id="drawer"><div class="in" id="drawer-in"></div></aside></div>
<script>/*__ELK__*/</script>
<script>
const M = __DATA__;
const SERVED = !!M.served;
const $ = (s, r = document) => r.querySelector(s);
const H = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const short = path => path.split(".").slice(1).join(".");
const KCOL = {Signal: "var(--sig)", Power: "var(--pwr)", Mechanical: "var(--mech)"};
const METHOD = {T: "Test", I: "Inspection", A: "Analysis", D: "Demonstration"};
const SEVN = {"1": "Annoying", "2": "Mission degraded", "3": "Mission lost", "4": "Hardware damage"};
const ICON = {Verified: "✓", Failed: "✕", Approved: "●", Draft: "", Deleted: "–"};
const pill = s => `<span class="pill ${H(s)}"><i>${ICON[s] ?? "?"}</i>${H(s)}</span>`;
const reqById = Object.fromEntries(M.requirements.map(r => [r.id, r]));
const partReqs = path => { const p = M.parts[path]; return M.requirements.filter(r => r.parts.includes(path) || (p.depth === 1 && r.subsystem === p.name) || (p.depth >= 2 && r.subsystem === p.subsystem && !r.parts.length) || (p.depth === 0 && r.subsystem === M.top)); };
const faultsFor = ids => M.faults.filter(f => f.reqs.some(x => ids.includes(x)));
const decisionsFor = (path, ids) => M.decisions.filter(d => d.parts.includes(path) || d.reqs.some(x => ids.includes(x)));
const conns = M.connections.filter(c => c.ok);
const kindCount = k => conns.filter(c => c.kind === k).length;

// ------------------------------------------------------------------ chrome
const VIEWS = [
  ["Model", [["overview", "Overview", null, () => M.problems.length + M.gaps.length || ""]]],
  ["Views", [["system", "System", "var(--ink)", () => M.subsystems.length], ["electrical", "Electrical", "var(--sig)", () => kindCount("Signal")],
             ["power", "Power", "var(--pwr)", () => kindCount("Power")], ["mechanical", "Mechanical", "var(--mech)", () => kindCount("Mechanical")],
             ["software", "Software (ROS2)", "var(--arch)", () => M.nodes.length]]],
  ["Records", [["interfaces", "Interfaces (ICD)", null, () => M.icd.length], ["requirements", "Requirements", null, () => M.requirements.length],
               ["faults", "Faults (FDIR)", null, () => M.faults.length], ["decisions", "Decisions", null, () => M.decisions.length]]],
  ["Project", [["issues", "Issues", null, () => (M.issues || []).filter(i => i.state === "open").length || ""], ["docs", "Docs", null, () => (M.docs || []).length],
               ["media", "Media", null, () => (M.media || []).length]]],
];
let view = "overview", focus = null, selected = null;
function chrome() {
  $("#title").textContent = M.name;
  $("#subtitle").textContent = `${Object.keys(M.parts).length - 1} parts · ${conns.length} connections · built ${(M.built || "").replace("T", " ")}${SERVED ? " · live" : ""}`;
  const verified = M.requirements.filter(r => r.status === "Verified").length;
  $("#counters").innerHTML = `${M.problems.length ? `<span class="counter bad" data-go="overview"><b>${M.problems.length}</b> model problem${M.problems.length > 1 ? "s" : ""}</span>` : ""}
    <span class="counter gap" data-go="overview"><b>${M.gaps.length}</b> gaps</span>
    <span class="counter" data-go="requirements"><b>${verified}/${M.requirements.length}</b> verified</span>
    ${SERVED ? `<button class="newbtn" id="newbtn">+ New</button>` : ""}`;
  if (SERVED) $("#newbtn").onclick = ev => { ev.stopPropagation(); newMenu(); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#nav").innerHTML = VIEWS.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([id, label, col, n]) =>
    `<button data-v="${id}" class="${id === view ? "on" : ""}">${col ? `<span class="dot" style="background:${col}"></span>` : `<span class="dot"></span>`}${label}<span class="n">${n()}</span></button>`).join("")).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
}
function go(v, opts = {}) { focus = opts.focus ?? null; view = v; chrome(); render(); saveHash(); }
function saveHash() { const h = [view, focus ? "focus:" + focus : "", selected ? "sel:" + selected : ""].filter(Boolean).join("/"); history.replaceState(null, "", "#" + h); }
function loadHash() { const parts = decodeURIComponent(location.hash.slice(1)).split("/"); const v = parts[0];
  if (v && document.querySelector) { view = VIEWS.flatMap(g => g[1]).some(x => x[0] === v) ? v : view; }
  parts.slice(1).forEach(x => { if (x.startsWith("focus:")) focus = x.slice(6); if (x.startsWith("sel:")) selected = x.slice(4); }); }

// ------------------------------------------------------------------ drawer
let refit = null;
const afterPanel = () => setTimeout(() => refit && refit(), 200);
function openDrawer(html) { afterPanel(); $("#drawer-in").innerHTML = `<button class="btn x" id="dx">Close</button>` + html; $("#drawer").classList.add("open"); $("#dx").onclick = closeDrawer; wire($("#drawer-in")); }
function closeDrawer() { if ($("#drawer").classList.contains("open")) afterPanel(); $("#drawer").classList.remove("open"); const had = selected; selected = null; if (had) saveHash(); document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel")); }
function wire(root) {
  root.querySelectorAll("[data-part]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showPart(e.dataset.part); });
  root.querySelectorAll("[data-req]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showReq(e.dataset.req); });
  root.querySelectorAll("[data-fault]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showFault(e.dataset.fault); });
  root.querySelectorAll("[data-node]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showNode(e.dataset.node); });
  root.querySelectorAll("[data-topic]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showTopic(e.dataset.topic); });
  root.querySelectorAll("[data-dec]").forEach(e => e.onclick = ev => { ev.stopPropagation(); go("decisions"); setTimeout(() => document.getElementById("d" + e.dataset.dec)?.scrollIntoView({behavior: "smooth"}), 50); });
  root.querySelectorAll("[data-form]").forEach(e => e.onclick = ev => { ev.stopPropagation(); openForm(e.dataset.form, {...e.dataset}); });
  root.querySelectorAll("[data-media]").forEach(e => e.onclick = ev => { ev.stopPropagation(); lightbox(e.dataset.media); });
  root.querySelectorAll("[data-issue]").forEach(e => e.onclick = ev => { ev.stopPropagation(); go("issues"); setTimeout(() => document.getElementById("i" + e.dataset.issue)?.scrollIntoView({behavior: "smooth", block: "center"}), 60); });
  root.querySelectorAll("[data-focus]").forEach(e => e.onclick = ev => { ev.stopPropagation(); go(e.dataset.view || "electrical", {focus: e.dataset.focus}); });
}
const reqChip = r => `<span class="chip" data-req="${H(r.id)}"><span class="pill ${H(r.status)}"><i>${ICON[r.status] ?? "?"}</i></span><span class="mono">${H(r.id)}</span></span>`;
function reqList(rs, path) {
  if (!rs.length) return `<div class="dsub">None yet.</div>`;
  return `<div class="mini">${rs.map(r => `<div class="mitem" data-req="${H(r.id)}"><div class="h"><span class="id">${H(r.id)}</span>${pill(r.status)}${path && r.parts.includes(path) ? `<span class="chip" style="margin-left:auto">this part</span>` : ""}</div>${H(r.text)}</div>`).join("")}</div>`;
}
function faultList(fs) {
  if (!fs.length) return `<div class="dsub">None analysed yet.</div>`;
  return `<div class="mini">${fs.map(f => `<div class="mitem" data-fault="${H(f.id)}" style="border-left:4px solid var(--sev${f.sev})"><div class="h"><span class="id">${H(f.id)}</span><span class="sev" style="--sevc:var(--sev${f.sev})">S${H(f.sev)}</span></div>${H(f.failure)}</div>`).join("")}</div>`;
}
function showPart(path) {
  selected = path; markSel(); saveHash();
  const p = M.parts[path];
  if (!p) return;
  const ids = partReqs(path).map(r => r.id);
  const linked = {};
  conns.forEach(c => { if (c.a[0] === path) (linked[c.a[1]] ||= []).push(c.b); if (c.b[0] === path) (linked[c.b[1]] ||= []).push(c.a); });
  let h = `<div class="dsub">${p.depth === 1 ? "Subsystem" : p.depth === 0 ? "System" : `Part in <span class="lnk" data-part="${M.top}.${p.subsystem}">${H(p.subsystem)}</span>`}${p.type ? ` · <span class="mono">${H(p.type)}</span>` : ""}</div>
    <div class="dh">${H(p.name)}</div>`;
  h += `<div class="links" style="margin:6px 0 4px"><span class="chip" style="color:var(--${p.source})">${p.source === "facts" ? "from .ioc (generated)" : "written in arch"}</span>${p.depth === 1 ? `<span class="chip focus" data-focus="${H(p.name)}">Open in Electrical</span>` : ""}</div>`;
  if (p.doc) h += `<p>${H(p.doc)}</p>`;
  const b = M.boards.find(b => b.board === p.board);
  if (b) {
    h += `<h4>Chip</h4><div class="kv"><div>Part number</div><div>${H(b.mcu)} ${H(b.package)}</div><div>Source</div><div class="mono">${H(b.source)}</div>${b.clocks.map(c => `<div>${H(c[0])}</div><div>${H(c[1])}</div>`).join("")}</div>`;
    b.internal.forEach(i => { h += `<h4>${H(i.ip)}</h4><div class="kv">${i.settings.map(s => `<div>${H(s[0])}</div><div>${H(s[1])}</div>`).join("")}</div>`; });
  }
  if (p.depth === 1) {
    h += `<h4>Parts</h4><div class="links">${p.children.map(c => `<span class="chip" data-part="${c}">${H(M.parts[c].name)}</span>`).join("") || "<span class='dsub'>none</span>"}</div>`;
    const ifs = M.icd.filter(i => i.pair.includes(p.name));
    h += `<h4>Interfaces to other subsystems</h4>` + (ifs.length ? `<table class="ptab"><tr><th>With</th><th>Via</th><th>Ends</th></tr>${ifs.map(i => `<tr><td>${H(i.pair.find(x => x !== p.name))}</td><td><span class="kdot" style="background:${KCOL[i.kind]}"></span>${H(i.meaning)}</td><td class="mono">${H(short(i.from))}<br>${H(short(i.to))}</td></tr>`).join("")}</table>` : `<div class="dsub">None.</div>`);
  }
  if (p.ports.length) {
    h += `<h4>Ports</h4><table class="ptab"><tr><th>Port</th><th>What</th><th>Pins</th><th>Connected to</th></tr>`;
    p.ports.forEach((q, i) => {
      const to = linked[q.name] || [];
      const det = q.settings && q.settings.length;
      h += `<tr class="${to.length ? "" : "off"} ${det ? "row" : ""}" data-i="${i}"><td class="mono">${det ? "▸ " : ""}${H(q.name)}</td><td><span class="kdot" style="background:${KCOL[q.kind]}"></span>${H(q.meaning || q.type)}</td>
        <td class="mono">${(q.pins || []).map(x => `${H(x[0])} <span style="color:var(--faint)">${H(x[1])}</span>`).join("<br>") || "—"}</td>
        <td>${to.map(t => `<span class="lnk mono" data-part="${t[0]}">${H(short(t[0]))}.${H(t[1])}</span>`).join("<br>") || "—"}</td></tr>`;
      if (det) h += `<tr class="det" data-d="${i}" style="display:none"><td colspan="4"><div class="kv">${q.settings.map(s => `<div>${H(s[0])}</div><div>${H(s[1])}</div>`).join("")}</div></td></tr>`;
    });
    h += `</table>`;
  }
  const hosted = M.nodes.filter(n => n.host === path || (p.depth === 1 && n.host && M.parts[n.host]?.subsystem === p.name));
  if (hosted.length) h += `<h4>ROS2 nodes running here</h4><div class="links">${hosted.map(n => `<span class="chip" data-node="${H(n.name)}">${H(n.name)}</span>`).join("")}</div>`;
  const rs = partReqs(path);
  h += `<h4>Requirements</h4>${reqList(rs, path)}<h4>Faults</h4>${faultList(faultsFor(ids))}`;
  const ds = decisionsFor(path, ids);
  if (ds.length) h += `<h4>Decisions</h4><div class="mini">${ds.map(d => `<div class="mitem" data-dec="${d.num}"><div class="h"><span class="id">${d.num}</span><b>${H(d.title)}</b></div>${H(d.decision).slice(0, 160)}</div>`).join("")}</div>`;
  const iss = issuesFor(p.depth === 1 ? p.name : p.subsystem, ids).filter(i => i.state === "open");
  if (iss.length) h += `<h4>Open issues</h4><div class="mini">${iss.map(issueMini).join("")}</div>`;
  const med = (M.media || []).filter(x => x.reqs.some(r => ids.includes(r)));
  if (med.length) h += `<h4>Media</h4>${thumbs(med.map(x => x.file))}`;
  const gp = M.gaps.filter(g => g.refs.includes(path));
  if (gp.length) h += `<h4>Gaps</h4>${gp.map(g => `<div class="warnline">⚠ ${H(g.text)}</div>`).join("")}`;
  openDrawer(h);
  document.querySelectorAll("#drawer-in tr.row").forEach(tr => tr.onclick = () => { const d = $(`#drawer-in tr[data-d="${tr.dataset.i}"]`); d.style.display = d.style.display ? "" : "none"; tr.firstElementChild.textContent = tr.firstElementChild.textContent.replace(/^[▸▾]/, d.style.display ? "▸" : "▾"); });
}
function showReq(id) {
  const r = reqById[id];
  if (!r) return;
  const fs = M.faults.filter(f => f.reqs.includes(id));
  const ds = M.decisions.filter(d => d.reqs.includes(id));
  const where = r.parts.length ? r.parts : (r.subsystem ? [r.subsystem === M.top ? M.top : `${M.top}.${r.subsystem}`] : []);
  openDrawer(`<div class="dsub">Requirement · ${H(METHOD[r.method] || r.method || "no method")}</div><div class="dh mono">${H(r.id)}</div><div style="margin:6px 0">${pill(r.status)}</div>
    <p style="font-size:15px">${H(r.text)}</p><div class="dsub">${H(r.rationale)}</div>
    <h4>Belongs to</h4><div class="links">${where.map(w => `<span class="chip" data-part="${w}">${H(short(w) || M.top)}</span>`).join("") || `<span class="warnline">No subsystem named ${H(r.prefix)}</span>`}</div>
    ${SERVED ? `<div class="links" style="margin:10px 0"><button class="act" data-form="test" data-rid="${H(r.id)}">Record test</button><button class="act" data-form="update_req" data-rid="${H(r.id)}">Edit</button><button class="act dz" data-form="delete_req" data-rid="${H(r.id)}">Mark deleted</button></div>` : ""}
    <h4>Evidence</h4>${r.evidence.map(e => `<div class="ev" style="font-size:12.5px;border-left:2px solid var(--hair);padding-left:8px;margin-bottom:6px">${H(e)}</div>`).join("") || `<div class="dsub">None yet.</div>`}
    ${(r.media || []).length ? thumbs(r.media) : ""}
    <h4>Faults it covers</h4>${faultList(fs)}${ds.length ? `<h4>Decisions</h4><div class="mini">${ds.map(d => `<div class="mitem" data-dec="${d.num}"><span class="id">${d.num}</span> ${H(d.title)}</div>`).join("")}</div>` : ""}`);
}
function showFault(id) {
  const f = M.faults.find(x => x.id === id);
  openDrawer(`<div class="dsub">Fault · severity ${H(f.sev)} (${H(SEVN[f.sev] || "?")})</div><div class="dh mono">${H(f.id)}</div><p style="font-size:15px;font-weight:600">${H(f.failure)}</p>
    ${SERVED ? `<div class="links" style="margin:0 0 10px"><button class="act" data-form="update_fault" data-fid="${H(f.id)}">Edit</button></div>` : ""}
    <div class="kv"><div>Effect</div><div>${H(f.effect)}</div><div>Detection</div><div>${H(f.detection)}</div><div>Response</div><div>${H(f.response)}</div><div>Recovery</div><div>${H(f.recovery)}</div></div>
    <h4>Covered by</h4>${f.reqs.length ? reqList(f.reqs.map(x => reqById[x]).filter(Boolean)) : `<div class="warnline">⚠ No requirement covers this fault</div>`}`);
}
function showNode(name) {
  const n = M.nodes.find(x => x.name === name);
  const row = (e, role) => `<tr class="row" data-topic="${H(e.topic)}"><td>${role}</td><td class="mono lnk">${H(e.topic)}</td><td class="mono">${H(e.type)}</td><td class="mono">:${e.line}</td></tr>`;
  openDrawer(`<div class="dsub">ROS2 node · ${H(n.lang === "c" ? "micro-ROS (C)" : n.lang === "py" ? "Python" : "C++")}</div><div class="dh">${H(n.name)}</div>
    <div class="kv" style="margin-top:8px"><div>Source</div><div class="mono">${H(n.file)}</div><div>Runs on</div><div>${n.host ? `<span class="lnk" data-part="${n.host}">${H(short(n.host))}</span>` : `<span class="warnline">not allocated</span>`}</div></div>
    <h4>Topics</h4><table class="ptab"><tr><th></th><th>Topic</th><th>Type</th><th>Line</th></tr>${n.pub.map(e => row(e, "pub")).join("")}${n.sub.map(e => row(e, "sub")).join("")}</table>`);
}
function showTopic(t) {
  const x = M.topics.find(y => y.topic === t);
  openDrawer(`<div class="dsub">ROS2 topic</div><div class="dh mono">${H(t)}</div><div class="dsub mono">${x.types.map(H).join(", ")}</div>
    <h4>Published by</h4><div class="links">${x.pub.map(n => `<span class="chip" data-node="${H(n)}">${H(n)}</span>`).join("") || `<span class="warnline">nobody</span>`}</div>
    <h4>Subscribed by</h4><div class="links">${x.sub.map(n => `<span class="chip" data-node="${H(n)}">${H(n)}</span>`).join("") || `<span class="warnline">nobody</span>`}</div>`);
}
function markSel() { document.querySelectorAll(".leaf").forEach(g => g.classList.toggle("sel", g.dataset.part === selected)); hot(selected); }

// ------------------------------------------------------------------ diagrams
const elk = new ELK();
const PORT_H = 20, HEAD = 50;
function sideOf(part, q) { return part.source === "facts" && !q.own ? "EAST" : q.conj ? "WEST" : "EAST"; }
function leafNode(path, kinds, used) {
  const p = M.parts[path];
  const ports = p.ports.filter(q => used.has(`${path}.${q.name}`));
  const east = ports.filter(q => sideOf(p, q) === "EAST"), west = ports.filter(q => sideOf(p, q) === "WEST");
  const lw = s => Math.max(0, ...s.map(q => q.name.length)) * 6.6;
  const width = Math.max(150, p.name.length * 7.6 + 40, (p.type || "").length * 6.4 + 40, lw(east) + lw(west) + 60);
  const height = HEAD + Math.max(east.length, west.length, 1) * PORT_H + (p.ports.length > ports.length ? 16 : 4);
  return {id: path, width, height, ports: ports.map(q => ({id: `${path}.${q.name}`, width: 9, height: 9, layoutOptions: {"elk.port.side": sideOf(p, q)}})),
          layoutOptions: {"elk.portConstraints": "FIXED_SIDE", "elk.portAlignment.default": "BEGIN", "elk.spacing.portPort": "11",
}};
}
function buildElectrical(kinds) {
  const cs = M.connections.filter(c => c.drawn && kinds.includes(c.kind));
  let keep = null;
  if (focus) { keep = new Set(); cs.forEach(c => { const sa = M.parts[c.a[0]].subsystem, sb = M.parts[c.b[0]].subsystem; if (sa === focus || sb === focus) { keep.add(c.a[0]); keep.add(c.b[0]); } }); M.parts[`${M.top}.${focus}`].children.forEach(k => keep.add(k)); }
  const used = new Set(); const shown = cs.filter(c => !keep || (keep.has(c.a[0]) && keep.has(c.b[0])));
  shown.forEach(c => { used.add(c.a.join(".")); used.add(c.b.join(".")); });
  const containers = M.subsystems.map(s => {
    const leaves = M.parts[`${M.top}.${s}`].children.filter(k => (!keep || keep.has(k)) && (kinds.length > 1 ? true : M.parts[k].ports.some(q => used.has(`${k}.${q.name}`))));
    return leaves.length ? {id: `${M.top}.${s}`, children: leaves.map(k => leafNode(k, kinds, used)), edges: [],
      layoutOptions: {"elk.padding": "[top=40,left=16,bottom=16,right=16]", "elk.algorithm": "layered", "elk.direction": "RIGHT"}} : null;
  }).filter(Boolean);
  const present = new Set(containers.flatMap(c => c.children.map(x => x.id)));
  const root = {id: "root", layoutOptions: {"elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.hierarchyHandling": "INCLUDE_CHILDREN", "elk.edgeRouting": "ORTHOGONAL",
    "elk.layered.spacing.nodeNodeBetweenLayers": "70", "elk.spacing.nodeNode": "30", "elk.spacing.edgeNode": "18", "elk.spacing.edgeEdge": "9", "elk.layered.spacing.edgeNodeBetweenLayers": "18",
    "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX", "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES"}, children: containers, edges: []};
  shown.filter(c => present.has(c.a[0]) && present.has(c.b[0])).forEach((c, i) => {
    const sa = M.parts[c.a[0]].subsystem, sb = M.parts[c.b[0]].subsystem;
    const edge = {id: "e" + i, sources: [c.a.join(".")], targets: [c.b.join(".")], c};
    const pa = M.parts[c.a[0]].ports.find(q => q.name === c.a[1]);
    if (sideOf(M.parts[c.a[0]], pa) === "WEST") { edge.sources = [c.b.join(".")]; edge.targets = [c.a.join(".")]; }
    if (sa === sb) containers.find(x => x.id === `${M.top}.${sa}`).edges.push(edge); else root.edges.push(edge);
  });
  return {graph: root, kinds};
}
function buildSystem() {
  const agg = {};
  conns.forEach(c => {
    const sa = M.parts[c.a[0]].subsystem, sb = M.parts[c.b[0]].subsystem;
    if (!sa || !sb || sa === sb) return;
    const [x, y] = M.parts[c.a[0]].source === "facts" || (M.parts[c.a[0]].ports.find(q => q.name === c.a[1]) || {}).conj === false ? [sa, sb] : [sb, sa];

      fld("measured", "What did you measure / observe?", 'e.g. "stop at 5.2 s, 3 runs"', inp("measured")) +
      fld("evidence", "Evidence (file in media/, log name, plot)", "Upload puts the file in docs/media/ and writes its name here.", inp("evidence") + `<label class="act" style="display:inline-block;margin-top:6px">Upload photo / video / log<input type="file" accept="image/*,video/*,.csv,.txt,.log,.pdf" data-upto="evidence" style="display:none"></label>`)};
    case "fault": return {title: "New fault (FDIR row)", sub: "Added to docs/fdir.md.", html:
      fld("failure", "What fails?", 'e.g. "Radio link lost"', inp("failure")) + fld("effect", "Effect on the system / mission", "", inp("effect")) +
      fld("detection", "How is it detected?", 'e.g. "no heartbeat ACK for 5 s"', inp("detection")) + fld("response", "Immediate response (isolate / make safe)", "", inp("response")) +
      fld("recovery", "Recovery", 'e.g. "resume when link returns; operator re-arms"', inp("recovery")) +
      `<div class="two">${fld("sev", "Severity", "Worst credible outcome.", sel("sev", SEV_))}${fld("req", "Requirement that covers it", "Optional.", sel("req", reqOpts(), "", "none yet"))}</div>`};
    case "update_fault": return {title: `Edit ${f.id}`, sub: "Changes this row in docs/fdir.md.", html:
      fld("failure", "What fails?", "", inp("failure", f.failure)) + fld("effect", "Effect", "", inp("effect", f.effect)) + fld("detection", "Detection", "", inp("detection", f.detection)) +
      fld("response", "Immediate response", "", inp("response", f.response)) + fld("recovery", "Recovery", "", inp("recovery", f.recovery)) +
      `<div class="two">${fld("sev", "Severity", "", sel("sev", SEV_, f.sev))}${fld("req", "Requirement that covers it", "", sel("req", reqOpts(), f.req, "none"))}</div>`, extra: {fid: f.id}};
    case "update_req": return {title: `Edit ${r.id}`, sub: "Every change is written to the change log at the bottom of requirements.md.", html:
      fld("field", "What changes?", "", sel("field", [["status", `Status (now ${r.status})`], ["text", "Requirement text"], ["rationale", "Rationale"], ["method", `Verification method (now ${r.method || "-"})`]])) +
      `<div id="fv"></div>`, extra: {rid: r.id}};
    case "delete_req": return {title: `Mark ${r.id} deleted`, sub: "The row stays with status Deleted, and the ID is never reused. Faults that point to it will show a warning.", html:
      `<div class="dsub" style="margin-bottom:12px">${H(r.text)}</div>` + fld("why", "Why is it dropped?", "Required: future you will want to know.", inp("why")), op: "update_req", extra: {rid: r.id, field: "status", value: "Deleted"}};
    case "update_decision": return {title: `Decision ${dec.num}: ${dec.title}`, sub: "Decisions are never rewritten: change the status, or supersede with a new decision.", html:
      fld("field", "What changes?", "", sel("field", [["status", `Status (now ${dec.status || "-"})`], ["related", "Related issues / requirement IDs"]])) + `<div id="fv"></div>`, extra: {num: dec.num}};
    case "decision": return {title: "New decision record", sub: "Written to docs/decisions/ with the next number.", html:
      fld("title", "Title (state the decision itself)", 'e.g. "Use ROS2 Humble on all machines", not "ROS2 version"', inp("title")) +
      `<div class="two">${fld("status", "Status", "", sel("status", [["Accepted", "Accepted"], ["Proposed", "Proposed"]]))}${fld("supersedes", "Replaces an older decision?", "", sel("supersedes", M.decisions.map(x => [x.num, `${x.num} · ${x.title}`]), "", "no"))}</div>` +
      fld("related", "Related issues / requirement IDs", "e.g. #15, COMM-004", inp("related")) +
      fld("context", "Context: what problem forced a choice, and what constraints matter?", "Facts only. One point per line.", area("context")) +
      `<div class="fld"><label>Options you compared</label><div class="hint">Optional.</div><div id="opts"></div><button class="act" id="addopt" type="button">+ Option</button></div>` +
      fld("decision", "Decision in one or two sentences", "", area("decision", "", "")) + fld("factor", "Deciding factor (what tipped it?)", "", inp("factor")) +
      fld("consequences", "Consequences: what gets easier, harder, what to do next, when to revisit", "One point per line.", area("consequences"))};
  }
}
function openForm(kind, data = {}) {
  if (!SERVED) return toast("Forms need doc serve", true);
  const spec = formSpec(kind, data);
  const op = spec.op || kind;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h3>${H(spec.title)}</h3><div class="sub">${spec.sub}</div><form id="frm">${spec.html}</form>
    <div id="pvw" style="display:none"></div><div class="mfoot"><span class="sp dsub" id="fmsg"></span><button class="btn" id="fcancel">Cancel</button><button class="newbtn" id="fgo">Preview</button></div></div>`;
  document.body.appendChild(m);
  m.onclick = ev => { if (ev.target === m) m.remove(); };
  $("#fcancel").onclick = () => m.remove();
  const frm = $("#frm");
  // dependent fields
  const fv = $("#fv");
  const drawFv = () => { if (!fv) return; const fieldv = frm.field.value, r = reqById[data.rid], dec = M.decisions.find(x => x.num === data.num);
    if (kind === "update_req") fv.innerHTML = fieldv === "status" ? fld("value", "New status", "", sel("value", [["Draft", "Draft"], ["Approved", "Approved"], ["Verified", "Verified"], ["Failed", "Failed"], ["Deleted", "Deleted (dropped; the ID is never reused)"]], r.status)) + `<div id="whyw"></div>`
      : fieldv === "text" ? fld("value", "Requirement", 'Form: "The &lt;thing&gt; shall &lt;do what&gt; &lt;measurable limit&gt;."', area("value", r.text, "")) + (r.status === "Verified" ? `<div class="fld"><label><input type="checkbox" name="retest" checked style="width:auto"> It was Verified: set back to Approved (retest needed)</label></div>` : "")
      : fieldv === "rationale" ? fld("value", "Rationale", "", inp("value", r.rationale)) : fld("value", "Verification method", "", sel("value", METHODS_, r.method || "T"));
    if (kind === "update_decision") fv.innerHTML = fieldv === "status" ? fld("value", "New status", "", sel("value", [["Proposed", "Proposed"], ["Accepted", "Accepted"], ["Rejected", "Rejected"], ["Superseded", "Superseded by a newer decision"]], (dec.status || "").split(" ")[0])) + `<div id="byw"></div>`
      : fld("value", "Related issues / requirement IDs", "Replaces the current value.", inp("value", dec.related));
    const v = frm.value; if (v) v.onchange = () => { if ($("#whyw")) $("#whyw").innerHTML = v.value === "Deleted" ? fld("why", "Why is it dropped?", "", inp("why")) : "";
      if ($("#byw")) $("#byw").innerHTML = v.value === "Superseded" ? fld("by", "Superseded by decision number", "", sel("by", M.decisions.map(x => [x.num, `${x.num} · ${x.title}`]))) : ""; }; };
  if (frm.field) { frm.field.onchange = drawFv; drawFv(); }
  if ($("#addopt")) { let n = 0; $("#addopt").onclick = () => { n++; const o = document.createElement("div"); o.className = "opts";
    o.innerHTML = fld(`o${n}_name`, `Option ${n}: name`, "", inp(`o${n}_name`)) + `<div class="two">${fld(`o${n}_pros`, "Pros", "", area(`o${n}_pros`))}${fld(`o${n}_cons`, "Cons", "", area(`o${n}_cons`))}</div>`;
    $("#opts").appendChild(o); }; }
  if (frm.shall || (kind === "update_req")) frm.addEventListener("input", () => { const t = frm.shall || (frm.field && frm.field.value === "text" ? frm.value : null); if (!t) return;
    const w = []; if (!/shall/i.test(t.value)) w.push('no "shall"'); if (!/\d/.test(t.value)) w.push("no number to measure");
    const box = $("#w_" + t.name); if (box) box.textContent = t.value && w.length ? "⚠ " + w.join(", ") + " (you can keep it anyway)" : ""; });
  frm.querySelectorAll("[data-upto]").forEach(u => u.onchange = async () => { for (const file of u.files) { $("#fmsg").textContent = `Uploading ${file.name}…`;
    const r = await upload(file); if (r) { const t = frm[u.dataset.upto]; t.value = (t.value ? t.value + (t.tagName === "TEXTAREA" ? "\n" : ", ") : "") + r.file; $("#fmsg").textContent = r.message; } } });
  const collect = () => { const o = {...(spec.extra || {})}; new FormData(frm).forEach((v, k) => { if (!/^o\d+_/.test(k)) o[k] = v; });
    if (frm.retest) o.retest = frm.retest.checked;
    if (kind === "decision") { o.options = []; document.querySelectorAll("#opts .opts").forEach((x, i) => o.options.push({name: frm[`o${i + 1}_name`].value, pros: frm[`o${i + 1}_pros`].value, cons: frm[`o${i + 1}_cons`].value})); }
    return o; };
  let stage = "form", body = null;
  $("#fgo").onclick = async () => {
    try {
      if (stage === "form") { body = collect(); const r = await post(`api/preview/${op}`, body);
        $("#pvw").style.display = ""; frm.style.display = "none";
        $("#pvw").innerHTML = `<div class="dsub">Will write: <span class="mono">${H(r.target)}</span></div>${(r.warnings || []).map(w => `<div class="warn" style="color:var(--warn-ink);margin:6px 0">⚠ ${H(w)}</div>`).join("")}<div class="pv">${H(r.preview)}</div>`;
        $("#fgo").textContent = op === "idea" || op === "bug" ? "Create issue" : "Write it"; $("#fcancel").textContent = "Back"; $("#fcancel").onclick = () => { stage = "form"; frm.style.display = ""; $("#pvw").style.display = "none"; $("#fgo").textContent = "Preview"; $("#fcancel").textContent = "Cancel"; $("#fcancel").onclick = () => m.remove(); };
        stage = "preview";
      } else { $("#fgo").disabled = true; $("#fmsg").textContent = "Saving…"; const r = await post(`api/apply/${op}`, body);
        m.remove(); toast(r.message + (r.url ? " " + r.url : "")); setTimeout(() => location.reload(), 900); }
    } catch (e) { $("#fgo").disabled = false; $("#fmsg").textContent = ""; toast(e.message, true); }
  };
}

loadHash(); const _sel = selected; chrome(); render(); if (_sel && M.parts[_sel]) setTimeout(() => showPart(_sel), 500);
if (SERVED) startPolling();
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
