</style></head><body>
<header><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="counters" id="counters"></div></header>
<div class="shell"><nav id="nav"></nav><main id="main"></main><aside id="drawer"><div class="in" id="drawer-in"></div></aside></div>
<script>/*__ELK__*/</script>
<script>
let M = __DATA__;
const SERVED = !!M.served;
const $ = (s, r = document) => r.querySelector(s);
const H = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const short = path => path.split(".").slice(1).join(".");
const KCOL = {Signal: "var(--sig)", Power: "var(--pwr)", Mechanical: "var(--mech)"};
const METHOD = {T: "Test", I: "Inspection", A: "Analysis", D: "Demonstration"};
const SEVN = {"1": "Annoying", "2": "Mission degraded", "3": "Mission lost", "4": "Hardware damage"};
const ICON = {Verified: "✓", Failed: "✕", Approved: "●", Draft: "", Deleted: "–"};
const pill = s => `<span class="pill ${H(s)}"><i>${ICON[s] ?? "?"}</i>${H(s)}</span>`;
let reqById = Object.fromEntries(M.requirements.map(r => [r.id, r]));
const partReqs = path => { const p = M.parts[path]; return M.requirements.filter(r => r.parts.includes(path) || (p.depth === 1 && r.subsystem === p.name) || (p.depth >= 2 && r.subsystem === p.subsystem && !r.parts.length) || (p.depth === 0 && r.subsystem === M.top)); };
const faultsFor = ids => M.faults.filter(f => f.reqs.some(x => ids.includes(x)));
const decisionsFor = (path, ids) => M.decisions.filter(d => d.parts.includes(path) || d.reqs.some(x => ids.includes(x)));
let conns = M.connections.filter(c => c.ok);
const kindCount = k => conns.filter(c => c.kind === k).length;

// ------------------------------------------------------------------ chrome
const VIEWS = [
  ["Model", [["overview", "Overview", null, () => M.problems.length + M.gaps.length || ""], ...(SERVED ? [["setup", "Setup", null, () => ""]] : [])]],
  ["Views", [["system", "System", "var(--ink)", () => M.subsystems.length], ["electrical", "Electrical", "var(--sig)", () => kindCount("Signal")],
             ["power", "Power", "var(--pwr)", () => kindCount("Power")],
             ["software", "Software (ROS2)", "var(--arch)", () => M.nodes.length]]],
  ["Records", [["interfaces", "Interfaces (ICD)", null, () => M.icd.length], ["requirements", "Requirements", null, () => M.requirements.length],
               ["faults", "Faults (FDIR)", null, () => M.faults.length], ["decisions", "Decisions", null, () => M.decisions.length],
               ["budget", "Power & checks", null, () => (M.gaps || []).filter(g => g.kind === "power" || g.kind === "electrical").length || ""], ["bom", "BOM", null, () => (M.bom?.rows || []).length]]],
  ["Project", [["issues", "Issues", null, () => (M.issues || []).filter(i => i.state === "open").length || ""], ["docs", "Docs", null, () => (M.docs || []).length],
               ["media", "Media", null, () => (M.media || []).length]]],
];
let view = "overview", focus = null, selected = null, editing = SERVED, pend = null;
function chrome() {
  $("#title").textContent = M.name;
  $("#subtitle").textContent = `${Object.keys(M.parts).length - 1} parts · ${conns.length} connections · built ${(M.built || "").replace("T", " ")}${SERVED ? " · live" : ""}`;
  const verified = M.requirements.filter(r => r.status === "Verified").length;
  $("#counters").innerHTML = `${M.problems.length ? `<span class="counter bad" data-go="overview"><b>${M.problems.length}</b> model problem${M.problems.length > 1 ? "s" : ""}</span>` : ""}
    <span class="counter gap" data-go="overview"><b>${M.gaps.length}</b> gaps</span>
    <span class="counter" data-go="requirements"><b>${verified}/${M.requirements.length}</b> verified</span>
    <button class="btn" id="review" title="Design review pack: print or save as PDF">Review pack</button>
    ${SERVED && S_.last && /^(doc: |Revert "doc: )/.test(S_.last[0] || "") ? `<button class="btn" data-form="undo" title="Undo: ${H(S_.last[0])} (${H(S_.last[1] || "")}, ${H(S_.last[2] || "")})">↶ Undo</button>` : ""}
    ${SERVED ? `<button class="newbtn" id="newbtn">+ New</button>` : ""}`;
  $("#review").onclick = reviewPack; wire($("#counters"));
  if (SERVED) $("#newbtn").onclick = ev => { ev.stopPropagation(); newMenu(); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#nav").innerHTML = VIEWS.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([id, label, col, n]) =>
    `<button data-v="${id}" class="${id === view ? "on" : ""}">${col ? `<span class="dot" style="background:${col}"></span>` : `<span class="dot"></span>`}${label}<span class="n">${n()}</span></button>`).join("")).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
}
function go(v, opts = {}) { focus = opts.focus ?? null; view = v; pend = null; chrome(); render(); saveHash(); }
function saveHash() { const h = [view, focus ? "focus:" + focus : "", selected ? "sel:" + selected : "", ""].filter(Boolean).join("/"); history.replaceState(null, "", "#" + h); }
function loadHash() { const parts = decodeURIComponent(location.hash.slice(1)).split("/"); const v = parts[0];
  if (v && document.querySelector) { view = VIEWS.flatMap(g => g[1]).some(x => x[0] === v) ? v : view; }
  parts.slice(1).forEach(x => { if (x.startsWith("focus:")) focus = x.slice(6); if (x.startsWith("sel:")) selected = x.slice(4); }); }

// ------------------------------------------------------------------ drawer
let refit = null;
const afterPanel = () => setTimeout(() => refit && refit(), 200);
function openDrawer(html) { afterPanel(); $("#drawer-in").innerHTML = `<button class="xbtn" id="dx" title="Close (Esc)" aria-label="Close">✕</button>` + html; $("#drawer").classList.add("open"); $("#dx").onclick = closeDrawer; wire($("#drawer-in")); }
let reopen = null;
function closeDrawer() { reopen = null; if ($("#drawer").classList.contains("open")) afterPanel(); $("#drawer").classList.remove("open"); const had = selected; selected = null; if (had) saveHash(); document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel")); }
function wire(root) {
  root.querySelectorAll("[data-part]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showPart(e.dataset.part); });
  root.querySelectorAll("[data-req]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showReq(e.dataset.req); });
  root.querySelectorAll("[data-fault]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showFault(e.dataset.fault); });
  root.querySelectorAll("[data-node]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showNode(e.dataset.node); });
  root.querySelectorAll("[data-topic]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showTopic(e.dataset.topic); });
  root.querySelectorAll("[data-dec]").forEach(e => e.onclick = ev => { ev.stopPropagation(); go("decisions"); setTimeout(() => document.getElementById("d" + e.dataset.dec)?.scrollIntoView({behavior: "smooth"}), 50); });
  root.querySelectorAll("[data-form]").forEach(e => e.onclick = ev => { ev.stopPropagation(); openForm(e.dataset.form, {...e.dataset}); });
  root.querySelectorAll("[data-media]").forEach(e => e.onclick = ev => { ev.stopPropagation(); lightbox(e.dataset.media); });
  root.querySelectorAll("[data-issue]").forEach(e => e.onclick = ev => { ev.stopPropagation(); showIssue(+e.dataset.issue); });
  root.querySelectorAll("[data-focus]").forEach(e => e.onclick = ev => { ev.stopPropagation(); go(e.dataset.view || "electrical", {focus: e.dataset.focus, edit: e.dataset.edit ? true : undefined}); });
}
const reqChip = r => `<span class="chip" data-req="${H(r.id)}"><span class="pill ${H(r.status)}"><i>${ICON[r.status] ?? "?"}</i></span><span class="mono">${H(r.id)}</span></span>`;
function reqList(rs, path) {
  if (!rs.length) return `<div class="dsub">None yet.</div>`;
  return `<div class="mini">${rs.map(r => `<div class="mitem" data-req="${H(r.id)}"><div class="h"><span class="id">${H(r.id)}</span>${pill(r.status)}${path && r.parts.includes(path) ? `<span class="chip" style="margin-left:auto">this part</span>` : ""}</div>${H(r.text)}</div>`).join("")}</div>`;
}
function faultList(fs) {
  if (!fs.length) return `<div class="dsub">None analysed yet.</div>`;
  return `<div class="mini">${fs.map(f => `<div class="mitem" data-fault="${H(f.id)}" style="border-left:4px solid var(--sev${f.sev})"><div class="h"><span class="id">${H(f.id)}</span><span class="sev" style="--sevc:var(--sev${f.sev})">S${H(f.sev)}</span></div>${H(f.failure)}</div>`).join("")}</div>`;
}
function showPart(path) { setTimeout(() => reopen = () => showPart(path), 0);
  selected = path; markSel(); saveHash();
  const p = M.parts[path];
  if (!p) return;
  const ids = partReqs(path).map(r => r.id);
  const linked = {};
  conns.forEach(c => { if (c.a[0] === path) (linked[c.a[1]] ||= []).push(c.b); if (c.b[0] === path) (linked[c.b[1]] ||= []).push(c.a); });
  let h = `<div class="dsub">${p.depth === 1 ? "Subsystem" : p.depth === 0 ? "System" : `Part in <span class="lnk" data-part="${M.top}.${p.subsystem}">${H(p.subsystem)}</span>`}${p.type ? ` · <span class="mono">${H(p.type)}</span>` : ""}</div>
    <div class="dh">${H(p.name)}${p.depth === 1 && (M.prefix_names || {})[p.name] ? ` <span style="font-weight:400;color:var(--muted)">${H(M.prefix_names[p.name])}</span>` : ""}</div>`;
  h += `<div class="links" style="margin:6px 0 4px"><span class="chip" style="color:var(--${p.source})">${p.source === "facts" ? "board, from its .ioc" : p.depth === 1 ? "subsystem" : "part"}</span>${p.depth === 1 ? `<span class="chip focus" data-focus="${H(p.name)}">Open in Electrical</span>` : ""}</div>`;
  if (SERVED && p.depth === 1) h += `<div class="links" style="margin:10px 0"><button class="act" data-form="part" data-parent="${H(path)}">+ Part here</button><button class="act" onclick="go('setup')">Edit in Setup</button></div>`;
  if (SERVED && p.depth >= 2) h += `<div class="links" style="margin:10px 0"><button class="act" data-form="part" data-orig="${H(path)}">Edit part</button><button class="act" data-focus="${H(p.subsystem)}" data-view="electrical" data-edit="1">Connect ports…</button><button class="act" data-form="template" data-from="${H(path)}">Save to parts library</button><button class="act dz" data-form="part_delete" data-path="${H(path)}">Delete</button></div>`;
  if (p.doc) h += `<p>${H(p.doc)}</p>`;
  if (Object.keys(p.attrs || {}).length) h += `<h4>Details</h4><div class="kv">${attrsKv(p.attrs)}</div>`;
  const b = M.boards.find(b => b.board === p.board);
  if (b) {
    h += `<h4>Chip</h4><div class="kv"><div>Part number</div><div>${H(b.mcu)} ${H(b.package)}</div><div>Source</div><div class="mono">${H(b.source)}</div>${b.clocks.map(c => `<div>${H(c[0])}</div><div>${H(c[1])}</div>`).join("")}</div>`;
    b.internal.forEach(i => { h += `<h4>${H(i.ip)}</h4><div class="kv">${i.settings.map(s => `<div>${H(s[0])}</div><div>${H(s[1])}</div>`).join("")}</div>`; });
  }
  if (p.depth === 1) {
    h += `<h4>Parts</h4><div class="links">${p.children.map(c => `<span class="chip" data-part="${c}">${H(M.parts[c].name)}</span>`).join("") || "<span class='dsub'>none</span>"}</div>`;
    const ifs = M.icd.filter(i => i.pair.includes(p.name));
    h += `<h4>Interfaces to other subsystems</h4>` + (ifs.length ? `<table class="ptab"><tr><th>With</th><th>Via</th><th>Ends</th></tr>${ifs.map(i => `<tr><td>${H(i.pair.find(x => x !== p.name))}</td><td><span class="kdot" style="background:${KCOL[i.kind]}"></span>${H(i.meaning)}</td><td class="mono">${H(short(i.from))}<br>${H(short(i.to))}</td></tr>`).join("")}</table>` : `<div class="dsub">None.</div>`);
  }
  if (p.ports.length) {
    h += `<h4>Ports</h4><table class="ptab"><tr><th>Port</th><th>What</th><th>Pins</th><th>Connected to</th></tr>`;
    p.ports.forEach((q, i) => {

    ((M.power || []).length ? sec("Power budget", printTable([["Rail", "Voltage", "Available", "Drawn", "Margin"], ...M.power.map(r => [short(r.name), r.voltages.map(v => v + " V").join(" / ") || "—", r.capacity === null ? "—" : r.capacity + " A", r.load + " A", r.capacity ? `${((1 - r.load / r.capacity) * 100).toFixed(0)}%` : "—"])])) : "") +
    sec("Decisions", printTable([["No.", "Decision", "Status", "Why"], ...M.decisions.map(d => [d.num, `${d.title}: ${d.decision}`, d.status, d.why])])) +
    sec("Bill of materials", printTable([b.cols.map(c => c[1]), ...b.rows.map(x => x.cells)])) +
    ((M.problems.length + M.gaps.length) ? sec("Open problems and review questions", printTable([["Kind", "Text"], ...M.problems.map(p => ["model problem", p]), ...M.gaps.map(g => [g.kind, g.text])])) : ""));
}

// ------------------------------------------------------------------ setup
function setupPage() {
  const st = SET(), subs = st.subsystems, live = subs.filter(x => !x.deleted);
  const custom = st.port_types.filter(t => t.custom), builtin = st.port_types.filter(t => !t.custom);
  page(`<h2>Setup</h2><p class="lead">What the model is built from. Every change here is previewed, then written to <span class="mono">docs/model/model.toml</span> (and the arch file, the README table and the issue forms where they depend on it), committed and pushed like any record.</p>
  <div class="panel"><h3>Subsystems <span class="chip">${live.length}</span><span style="flex:1"></span><button class="newbtn" data-form="subsystem">+ Subsystem</button></h3>
    <div class="dsub" style="margin-bottom:8px">The boxes of the system diagram, and the prefixes of requirement IDs: <span class="mono">CTRL-001</span> belongs to <span class="mono">CTRL</span>. Group them the way the robot comes apart: by board or function on one chassis (CTRL, COMP, COMM, DRIVE, PWR), by assembly when there are several (BASE, ARM). Add a box-less group such as SYS for whole-robot requirements.</div>
    ${subs.length ? `<table class="stab"><tr><th></th><th>Prefix</th><th>Name</th><th>In diagram</th><th>Requirements</th><th>Parts</th><th></th></tr>${subs.map((x, i) => `<tr class="${x.deleted ? "gone" : ""}">
      <td style="white-space:nowrap">${x.deleted ? "" : `<button class="act" style="padding:0 6px" data-mv="${H(x.prefix)}" data-dir="-1" ${i ? "" : "disabled"}>↑</button><button class="act" style="padding:0 6px" data-mv="${H(x.prefix)}" data-dir="1" ${i < subs.length - 1 ? "" : "disabled"}>↓</button>`}</td>
      <td class="mono"><b>${H(x.prefix)}</b></td><td>${H(x.name)}${x.about ? `<div class="dsub" style="margin:0">${H(x.about)}</div>` : ""}</td>
      <td>${x.box ? (M.parts[`${M.top}.${x.prefix}`] ? `<span class="lnk xref" data-part="${M.top}.${H(x.prefix)}">box</span>` : "box") : `<span class="dsub">requirements only</span>`}</td><td>${x.reqs}</td><td>${x.box ? x.parts : "—"}</td>
      <td class="acts">${x.deleted ? `<span class="dsub">deleted (IDs kept)</span> <button class="act" data-op="subsystem_restore" data-prefix="${H(x.prefix)}">Restore</button>` : `<button class="act" data-form="subsystem" data-prefix="${H(x.prefix)}">Edit</button> <button class="act dz" data-form="subsystem_delete" data-prefix="${H(x.prefix)}">Delete</button>`}</td></tr>`).join("")}</table>`
      : `<div class="empty" style="padding:20px">No subsystems yet. Add the first one: everything else (boards, parts, requirements) goes into a subsystem.</div>`}</div>
  <div class="panel"><h3>Boards <span class="chip">${st.boards.length}</span><span style="flex:1"></span><button class="newbtn" data-form="board" ${boxSubs().length ? "" : "disabled title='Add a subsystem first'"}>+ Board</button></h3>
    <div class="dsub" style="margin-bottom:8px">Microcontrollers with a CubeMX project. Each points at its own <span class="mono">.ioc</span> file; its pins, buses, timers and clock settings are read from there on every rebuild. Computers without an .ioc (a Raspberry Pi) are ordinary parts: add them in the System views with Edit.</div>
    ${st.boards.length ? `<table class="stab"><tr><th>Name</th><th>.ioc file</th><th>Placed in</th><th></th></tr>${st.boards.map(b => `<tr><td class="mono"><b>${H(b.name)}</b></td><td class="mono" style="font-size:12px">${H(b.ioc)}</td>
      <td>${b.placed.map(p => `<span class="chip" data-part="${H(p)}">${H(short(p))}</span>`).join(" ") || `<span class="warnline">not placed</span>`}</td>
      <td class="acts"><button class="act" data-form="board_ioc" data-name="${H(b.name)}">Change .ioc</button> <button class="act dz" data-form="board_remove" data-name="${H(b.name)}">Remove</button></td></tr>`).join("")}</table>`
      : `<div class="dsub">No boards yet.${st.ioc_candidates.length ? ` Found ${st.ioc_candidates.length} .ioc file(s) in the repo.` : " No .ioc files found in the repo."}</div>`}</div>
  <div class="panel"><h3>ROS2 code folders <span class="chip">${st.ros_paths.length}</span><span style="flex:1"></span><button class="act" data-form="ros_paths">Change</button></h3>
    <div class="dsub" style="margin-bottom:8px">Scanned for nodes, publishers and subscribers (C++, Python, micro-ROS C). The robot does not need to be on. Which computer runs each node is set on the node (Software view).</div>
    ${st.ros_paths.map(x => `<div class="mono" style="padding:3px 0">${H(x)}</div>`).join("") || `<div class="dsub">None yet.</div>`}
    <div class="dsub" style="margin-top:6px">${M.nodes.length} node(s), ${M.topics.length} topic(s) found.</div></div>
  <div class="panel"><h3>Port types<span style="flex:1"></span><button class="act" data-form="port_type">+ Port type</button></h3>
    <div class="dsub" style="margin-bottom:8px">A port connects only to a port of the same type. Built in: ${builtin.map(t => `<span class="mono">${H(t.name)}</span>`).join(", ")}.</div>
    ${custom.length ? `<table class="stab"><tr><th>Type</th><th>Kind</th><th>Meaning</th><th></th></tr>${custom.map(t => `<tr><td class="mono">${H(t.name)}</td><td>${H(t.kind)}</td><td>${H(t.meaning)}</td><td class="acts"><button class="act dz" data-form="port_type_delete" data-name="${H(t.name)}">Delete</button></td></tr>`).join("")}</table>` : `<div class="dsub">No types of your own yet (e.g. Power5V for a 5 V rail, MotorMount for a mechanical mount).</div>`}</div>
  <div class="panel"><h3>Parts library<span style="flex:1"></span><button class="act" data-form="lib_folder">+ Folder</button><button class="act" data-form="template">+ Part</button></h3>
    <div class="dsub" style="margin-bottom:8px">Reusable parts (IMU, encoder, motor driver, radio…) with their details and ports. Folders are remembered on this computer (${H(st.library?.settings || "")}), so every project can use them. A folder inside the project is committed and shared with the team. In a part's panel, <i>Save to parts library</i> adds it here; a new part can start from one.</div>
    ${(st.library?.folders || []).map(f => `<div style="margin:10px 0 4px"><b class="mono">${H(f.path)}</b> ${f.default ? `<span class="chip">default</span>` : `<button class="act" data-op="lib_default" data-path="${H(f.path)}">Make default</button>`} <span class="dsub">${f.in_repo ? "in this project (committed)" : "on this computer"}${f.exists ? "" : " · missing"}</span> <button class="act dz" data-op="lib_folder_remove" data-path="${H(f.path)}">Forget</button></div>
      ${f.templates.length ? `<table class="stab">${f.templates.map(t => { const i = templates().findIndex(x => x.folder === f.path && x.file === t.file);
        return `<tr><td class="mono"><b>${H(t.name)}</b></td><td>${H(t.doc)}</td><td class="dsub">${t.ports.length} ports</td><td class="acts"><button class="act" data-form="template" data-tidx="${i}">Edit</button> <button class="act dz" data-form="template_delete" data-tidx="${i}">Delete</button></td></tr>`; }).join("")}</table>` : `<div class="dsub">No parts yet.</div>`}`).join("") || `<div class="dsub">No library folder yet.</div>`}</div>
  <div class="panel"><h3>Project</h3><div class="kv"><div>Name</div><div class="mono">${H(st.project)}</div><div>Arch file</div><div class="mono">${H(M.arch_file)}</div><div>Server</div><div>${S_.push ? "commits and pushes" : "commits only (--no-push)"} · ${H(S_.commit || "")}</div></div></div>`);
  document.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => quick("subsystem_move", {prefix: b.dataset.mv, dir: b.dataset.dir}));
  document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => quick(b.dataset.op, {prefix: b.dataset.prefix, path: b.dataset.path}));
}
async function quick(op, body) {
  try { const r = await post(`api/apply/${op}`, body); toast(r.message); await refreshModel(); if (window.syncNow) syncNow(); } catch (e) { toast(e.message, true); }
}

loadHash(); const _sel = selected; chrome(); render(); if (_sel && M.parts[_sel]) setTimeout(() => showPart(_sel), 500);
if (SERVED) startPolling();
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (pend) cancelPend(); else closeDrawer(); } });
</script></body></html>
